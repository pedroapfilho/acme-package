name: Build
on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by release.yml for the changeset-release/main PR, whose
  # pull_request runs are parked unexecuted behind an approval gate.
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
      - name: Restore Turbo task cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-
            turbo-${{ runner.os }}-build-push-main-
      # Turbo restores complete build outputs on a task hit. Preserve Next's
      # compiler cache separately so changed docs can still compile incrementally.
      - name: Restore Next.js compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/docs/.next/cache
          key: next-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-
            next-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-build-push-main-
      - run: pnpm build
