packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true

# Exempts the lint toolchain from the 24h minimumReleaseAge quarantine so it can be
# bumped the day it ships. Per-tool rather than per-version: pinned versions went
# stale on every bump (pnpm falls back silently rather than erroring), so the list
# exempted nothing while reading as if it did. The trade is that these publishers
# are trusted for all future versions, not re-approved per release.
minimumReleaseAgeExclude:
  - cnfast
  - "@oxlint-tsgolint/*"
  - "@oxlint/*"
  - oxlint
  - oxlint-config-awesomeness
  - oxlint-plugin-react-doctor
  - oxlint-tsgolint

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - lightningcss
  - sharp
  - unrs-resolver
